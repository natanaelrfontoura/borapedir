<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <script>
      // Ignore Vite HMR WebSocket errors as HMR is disabled in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          ((typeof event.reason.message === 'string' &&
            (event.reason.message.includes('WebSocket') || event.reason.message.includes('ws:'))) ||
            (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          (typeof event.message === 'string' && event.message.includes('WebSocket')) ||
          (typeof event.filename === 'string' && event.filename.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
